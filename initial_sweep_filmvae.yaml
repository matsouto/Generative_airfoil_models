project: FilmCSTVAE
program: src/filmvae/train.py
method: bayes
metric:
  name: val_geo_mae
  goal: minimize
parameters:
  epochs:
    value: 30
  batch_size:
    values: [16, 32, 64]
  latent_dim:
    values: [8, 16, 32]
  learning_rate:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.005
  clipnorm:
    values: [0.5, 1.0, 2.0]
  warmup_epochs:
    values: [25, 50, 100]
  target_beta:
    values: [0.001, 0.005, 0.01, 0.02]
  beta_annealing:
    values: [cyclical, linear, constant]
command:
  - ${env}
  - poetry
  - run
  - python
  - ${program}