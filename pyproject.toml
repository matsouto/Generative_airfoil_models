[project]
name = "aerogen"
version = "0.1.0"
description = "Generative models for airfoils"
authors = [{ name = "matsouto", email = "matsouto55@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tensorflow (>=2.21.0,<3.0.0)",
    "ipykernel (>=7.2.0,<8.0.0)",
    "aerosandbox (>=4.2.9,<5.0.0)",
    "plotly (>=6.7.0,<7.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "nbformat (>=5.10.4,<6.0.0)",
    "wandb (>=0.26.1,<0.27.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
